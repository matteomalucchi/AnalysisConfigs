# Configuration of scripts/apply_onnx_models.py
#
#   python scripts/apply_onnx_models.py -c scripts/apply_onnx_models_example.yaml
#
# `input`, `output`, `workers`, `chunk_size` and `tmp_dir` can also be given
# (and overridden) from the command line: -i, -o, -j, --chunk-size, --tmp-dir.

# Directory with the coffea files of a PocketCoffea run (as for the other
# scripts), or a list of coffea files / directories.
# If the coffea files contain the columns, they are read from there; otherwise
# they are read from the parquet files of `dump_columns_as_arrays_per_chunk`
# (`save_chunk` option) written in the config.json of the run.
input: /work/mmalucch/out_hh4b/my_run/

# Output directory. It contains all the original columns plus the ONNX scores:
# - columns in the coffea files: a copy of the coffea files with the new columns;
# - columns in parquet files: <output>/parquet_files/<dataset>/<category>/<variation>/*.parquet
#   (copies of the input files with the new columns), the coffea files and a
#   config.json pointing to the new parquet directory.
# If the output is on /pnfs (or an xrootd url), the files are written in a local
# temporary directory and copied with xrdcp (the slurm jobs cannot write on /pnfs).
output: /pnfs/psi.ch/cms/trivcat/store/user/mmalucch/out_hh4b/my_run_onnx/

# Redirector used to copy to /pnfs and written in the output config.json
redirector: root://t3dcachedb03.psi.ch:1094/
# Local temporary directory for /pnfs outputs (default: $TMPDIR or /tmp)
tmp_dir: null

# Number of parallel processes. 1 = everything in a single process.
workers: 8
# Number of events evaluated at once (and parallel task size for coffea columns;
# for parquet columns the parallel tasks are the parquet files).
chunk_size: 100000

# Variations to process (names or glob patterns). null = all the saved ones.
variations: [nominal]

# Fail (false) or overwrite (true) if a column with the same name already exists.
overwrite: false

# Also process output_all.coffea when a directory with per-dataset files is
# given (only relevant for columns saved in the coffea files).
process_output_all: false

# Optional: directory with the input parquet files, if not in config.json.
# parquet_input: /pnfs/psi.ch/cms/trivcat/store/user/mmalucch/out_hh4b/my_run/parquet_files/
# Optional: only process the first N parquet files per dataset/category/variation (tests).
# max_parquet_files: 2
# Optional: name of the parquet subdirectory of the output (default parquet_files).
# parquet_subdir: parquet_files

models:
  - name: sig_bkg_dnn
    # path to the onnx file
    model: /work/mmalucch/models/sig_bkg_dnn.onnx
    # Input variables dictionary, the same as in the standard PocketCoffea run.
    # Either `<python.module>:<variable>` or `<path/to/file.py>:<variable>`
    # (relative to the yaml, the current directory or the repository).
    input_variables: configs.HH4b_common.dnn_input_variables:sig_bkg_dnn_input_variables
    # Name of the column saved in the output. Use the `events_` prefix to have
    # the same name as the columns of the workflow (e.g. events_sig_bkg_dnn_score).
    # Default: events_<name>
    column_name: events_sig_bkg_dnn_score_new
    # Which column of the model output to save:
    #  auto (default, as sig_bkg_dnn_score in the workflow): 1D outputs as they
    #       are, <= 2 columns -> the last one, > 2 columns -> one column per
    #       class, named <column_name>_<i>
    #  <int>: only that column;  [<int>, ...]: those columns (<column_name>_<i>);
    #  all: all the columns (<column_name>_<i>)
    score_index: auto
    # Optional: name(s) of the ONNX output node to use (default: the first one).
    # Ignored for SPANet models, see spanet_output.
    onnx_output: null
    # Regions (categories) and datasets where the model is applied.
    # Names or glob patterns, null = all.
    regions: ["4b_*signal_region*", "4b_*control_region*"]
    datasets: null
    # Optional exclusions (names or glob patterns)
    exclude_datasets: null
    exclude_regions: null
    # Padding values, as in default_config.py
    pad_value: -999.0
    pad_value_spanet: 9999.0

  - name: ggf_vbf_spanet
    model: /work/mmalucch/models/ggf_vbf_spanet.onnx
    # SPANet models (with `sequential` and `global` inputs) are supported as well
    input_variables: configs/HH4b_common/dnn_input_variables.py:ggf_vbf_input_variables_spanet_nobtag
    column_name: events_VBF_ggF_score_new
    # SPANet output to save: class_prob (default), regr_value, detection_prob, assignment_prob
    spanet_output: class_prob
    # index in the list of the outputs of that type
    spanet_output_index: 0
    score_index: auto
    # number of jets of the sequential inputs (null = max number of jets in the chunk;
    # set it to the value used in the workflow, e.g. max_num_jets_vbf_discriminator)
    max_num_jets: null
    # mask of the SPANet global inputs: ones or padded (spanet_global_mask)
    spanet_global_mask: ones
    regions: ["*vbf*", "*VBF*"]
    datasets: ["*VBF*", "*GluGlu*", "DATA*"]
