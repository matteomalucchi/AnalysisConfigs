# Trigger filters of the HH4b triggers, used for
#  - the trigger object matching (`get_trigger_object_matching` cut of PocketCoffea)
#  - the conversion of the trigger efficiencies to a correctionlib file
#    (scripts/convert_trigger_sf_to_correctionlib.py)
#
# Each filter is defined by the string `A:B:C:D:E`, following the convention of the
# NanoAOD `TrigObj_filterBits` documentation:
#   A: type of the trigger object (Jet 1, MET 2, HT 3, FatJet 6, Electron 11,
#      Muon 13, Tau 15, Photon 22, boosted Tau 1515)
#   B: index of the bit of `TrigObj_filterBits` for the specific filter
#   C: number of objects required to pass the filter
#   D: online threshold of the filter
#   E: name of the filter (the same used to name the efficiency curves)
#
# N.B: the trigger bits are NOT consistent between NanoAOD versions: always check
# the NanoAOD self-documentation of the version used in the analysis at
# https://cms-xpog.docs.cern.ch/autoDoc/ . The bits below refer to NanoAODv12 for
# 2022 and 2023.

trigger_object_filters:
  "2022_preEE": &2022
    HLT_QuadPFJet70_50_40_35_PFBTagParticleNet_2BTagSum0p65:
      - "1:0:4:20:4PixelOnlyPFCentralJetTightIDPt20"
      - "1:1:3:30:3PixelOnlyPFCentralJetTightIDPt30"
      - "1:6:2:40:2PixelOnlyPFCentralJetTightIDPt40"
      - "1:22:1:60:1PixelOnlyPFCentralJetTightIDPt60"
      - "1:4:4:35:4PFCentralJetTightIDPt35"
      - "1:8:3:40:3PFCentralJetTightIDPt40"
      - "1:21:2:50:2PFCentralJetTightIDPt50"
      - "1:23:1:70:1PFCentralJetTightIDPt70"
      - "1:26:2:0.65:BTagCentralJetPt35PFParticleNet2BTagSum0p65"

  "2022_postEE": *2022

  "2023_preBPix": &2023
    HLT_QuadPFJet70_50_40_35_PNet2BTagMean0p65:
      - "1:0:4:20:4PixelOnlyPFCentralJetTightIDPt20"
      - "1:1:3:30:3PixelOnlyPFCentralJetTightIDPt30"
      - "1:6:2:40:2PixelOnlyPFCentralJetTightIDPt40"
      - "1:22:1:60:1PixelOnlyPFCentralJetTightIDPt60"
      - "1:4:4:35:4PFCentralJetTightIDPt35"
      - "1:8:3:40:3PFCentralJetTightIDPt40"
      - "1:21:2:50:2PFCentralJetTightIDPt50"
      - "1:23:1:70:1PFCentralJetTightIDPt70"
      - "1:26:2:0.65:BTagCentralJetPt35PFParticleNet2BTagSum0p65"
    HLT_PFHT280_QuadPFJet30_PNet2BTagMean0p55:
      - "1:0:4:20:4PixelOnlyPFCentralJetTightIDPt20"
      - "1:3:4:30:4PFCentralJetTightIDPt30"
      - "3:5:0:280:PFHT280Jet30"
      - "1:26:2:0.55:PFCentralJetPt30PNet2BTagMean0p55"

  "2023_postBPix": *2023

  "2024": &2024
    HLT_PFHT250_QuadPFJet25_PNet2BTagMean0p55:
      - "1:34:4:25:4PFCentralJetTightIDPt25"
      # the PFHT250Jet25 filter is not stored in NanoAOD
      - "1:35:2:0.55:PFCentralJetPt25PNet2BTagMean0p55"

  "2025": *2024
