# Parameters of the second approach, merged on top of the common ones
# (triggers.yaml, jets_calibration_regression_json.yaml, ...) when
# approach == "second" (see configurator_tools.get_approach_parameter_files).

HLT_triggers:
   # 2023: HLT_QuadPFJet70_50_40_35_PNet2BTagMean0p65 (JetMET) or
   # HLT_PFHT280_QuadPFJet30_PNet2BTagMean0p55 (ParkingHH), also in postBPix.
   # MC takes the OR of all the primary datasets.
   "2023_postBPix":
      JetMET:
         - QuadPFJet70_50_40_35_PNet2BTagMean0p65
   "2025":
      ParkingHH:
         - PFHT250_QuadPFJet25_PNet2BTagMean0p55

jets_calibration:
  forward_jets_mitigation:
    # VBF candidates in 2.5 < |eta| < 3.0 need pt > 50 GeV in every year, 2025 included
    pt_cut_HE:
      eta_regions:
        "2025": [[2.5, 3.0]]
