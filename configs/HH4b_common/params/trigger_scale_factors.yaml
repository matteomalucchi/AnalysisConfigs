# Configuration of the trigger scale factors applied by the `sf_trigger` weight of
# PocketCoffea (see `pocket_coffea.lib.trigger_sf` and the "Trigger scale factors"
# recipe of the PocketCoffea documentation).
#
# The total scale factor is the product of the data/MC efficiency ratios of the
# single filters of the trigger path (plus the OR of the L1 seeds), each of them
# evaluated as a function of a different observable.
#
# The correctionlib files are produced from the ROOT files with the efficiency
# curves, one era per call (the HLT filters of a trigger are usually measured
# separately per era, in files that do not carry the era in the object path -
# see `configs/HH4b_common/README.md`), e.g.
#
#   python scripts/convert_trigger_sf_to_correctionlib.py \
#       -i /pnfs/psi.ch/cms/trivcat/store/user/mmalucch/HH4b/trgSFs_2022_to_2025/2022_postEE \
#       -y 2022_postEE -o /pnfs/psi.ch/cms/trivcat/store/user/mmalucch/HH4b/trgSFs_2022_to_2025/2022_postEE/trigger_sf_2022_postEE.json.gz \
#       --dump-params configs/HH4b_common/params/trigger_sf_2022_postEE.yaml --era postEE
#
# N.B: the .json.gz files are NOT in the repository (they live on the Tier-3
# storage referenced by `file:` below), they have to be produced before running
# with the `trigger_sf` option enabled.

trigger_scale_factors:

  # HLT_QuadPFJet70_50_40_35_PFBTagParticleNet_2BTagSum0p65
  "2022_preEE":
    file: "/pnfs/psi.ch/cms/trivcat/store/user/mmalucch/HH4b/trgSFs_2022_to_2025/2022_preEE/trigger_sf_2022_preEE.json.gz"
    corrections:
      - name: sf_L1All
        variable:
          name: calojet_ht
          collection: Jet
      - name: sf_4PixelOnlyPFCentralJetTightIDPt20
        variable:
          name: jet_pt
          collection: JetGood
          index: 4
      - name: sf_3PixelOnlyPFCentralJetTightIDPt30
        variable:
          name: jet_pt
          collection: JetGood
          index: 3
      - name: sf_2PixelOnlyPFCentralJetTightIDPt40
        variable:
          name: jet_pt
          collection: JetGood
          index: 2
      - name: sf_1PixelOnlyPFCentralJetTightIDPt60
        variable:
          name: jet_pt
          collection: JetGood
          index: 1
      - name: sf_4PFCentralJetTightIDPt35
        variable:
          name: jet_pt
          collection: JetGood
          index: 4
      - name: sf_3PFCentralJetTightIDPt40
        variable:
          name: jet_pt
          collection: JetGood
          index: 3
      - name: sf_2PFCentralJetTightIDPt50
        variable:
          name: jet_pt
